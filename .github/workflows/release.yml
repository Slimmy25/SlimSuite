# Publishes a GitHub release for each new Slim Suite version.
# It runs when main is pushed with a changed SlimSuite.toc (or a changed workflow). If the version in
# "## Version:" has no release yet, it builds SlimSuite-<version>.zip and publishes release v<version>,
# creating that tag itself. Pushing main without changing the version publishes nothing.
name: Release

on:
  push:
    branches:
      - main
    paths:
      - "SlimSuite/SlimSuite.toc"
      - ".github/workflows/release.yml"

permissions:
  contents: write   # needed to create the tag and the release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the addon version
        id: version
        run: |
          version=$(grep -m1 '^## Version:' SlimSuite/SlimSuite.toc | sed 's/^## Version:[[:space:]]*//' | tr -d '\r')
          if [ -z "$version" ]; then echo "No '## Version:' line in SlimSuite.toc"; exit 1; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Skip if this version is already released
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.version.outputs.version }}" > /dev/null 2>&1; then
            echo "v${{ steps.version.outputs.version }} is already released; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the zip
        if: steps.check.outputs.skip != 'true'
        run: zip -r "SlimSuite-${{ steps.version.outputs.version }}.zip" SlimSuite -x "*.git*"

      - name: Create the release
        if: steps.check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" "SlimSuite-${{ steps.version.outputs.version }}.zip" \
            --target "$GITHUB_SHA" \
            --title "Slim Suite ${{ steps.version.outputs.version }}" \
            --generate-notes
